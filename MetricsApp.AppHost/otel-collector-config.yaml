receivers:
  # OTLP receiver for standard OpenTelemetry data
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Windows Performance Counters (when running on Windows)
  windowsperfcounters:
    collection_interval: 30s
    counters:
      - object: "Processor"
        instances: ["*"]
        counters: ["% Processor Time"]
      - object: "Memory"
        counters: ["Available MBytes", "Committed Bytes"]
      - object: "LogicalDisk"
        instances: ["*"]
        counters: ["% Free Space", "Free Megabytes"]
      - object: "Network Interface"
        instances: ["*"]
        counters: ["Bytes Total/sec"]

  # Host metrics (cross-platform)
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.io:
            enabled: true
      network:
        metrics:
          system.network.io:
            enabled: true
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true

processors:
  # Batch processor for efficiency
  batch:
    timeout: 1s
    send_batch_size: 1000
    send_batch_max_size: 1500

  # Memory limiter to prevent OOM
  memory_limiter:
    limit_mib: 256

  # Resource processor to add consistent resource attributes
  resource:
    attributes:
      - key: service.name
        value: "otel-collector"
        action: upsert
      - key: service.version
        value: "1.0.0"
        action: upsert

exporters:
  # Forward to MetricsApp API
  otlphttp/metricsapp:
    endpoint: http://metricsapp-api:8080/v1/otlp
    headers:
      content-type: "application/x-protobuf"
    compression: gzip

  # Forward to Jaeger for tracing
  otlp/jaeger:
    endpoint: http://jaeger:4317
    tls:
      insecure: true

  # Console exporter for debugging
  logging:
    loglevel: info

  # Prometheus metrics endpoint for collector monitoring
  prometheus:
    endpoint: "0.0.0.0:8888"

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance profiling
  pprof:
    endpoint: 0.0.0.0:8889

  # Memory ballast for stability
  memory_ballast:
    size_mib: 64

service:
  extensions: [health_check, pprof, memory_ballast]
  
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/metricsapp, otlp/jaeger, logging]
    
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/metricsapp, prometheus, logging]
    
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/metricsapp, logging]

  telemetry:
    logs:
      level: "info"
    metrics:
      address: 0.0.0.0:8888 