receivers:
  # OTLP receiver for standard OpenTelemetry data
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Host metrics (cross-platform) - removed windowsperfcounters as it has configuration issues
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.io:
            enabled: true
      network:
        metrics:
          system.network.io:
            enabled: true
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true

processors:
  # Batch processor for efficiency
  batch:
    timeout: 1s
    send_batch_size: 1000
    send_batch_max_size: 1500

  # Memory limiter to prevent OOM
  memory_limiter:
    limit_mib: 256
    check_interval: 1s

  # Resource processor to add consistent resource attributes
  resource:
    attributes:
      - key: service.name
        value: "otel-collector"
        action: upsert
      - key: service.version
        value: "1.0.0"
        action: upsert

exporters:
  # Forward to MetricsApp API - OTLP exporter adds /v1/{signal} automatically
  otlphttp/metricsapp-traces:
    endpoint: http://metricsapp-api:5247
    headers:
      content-type: "application/json"
    compression: gzip

#  otlphttp/metricsapp-metrics:
#    endpoint: http://metricsapp-api:5247
#    headers:
#      content-type: "application/json"
#    compression: gzip

  otlphttp/metricsapp-logs:
    endpoint: http://metricsapp-api:5247
    headers:
      content-type: "application/json"
    compression: gzip

  # Forward to Jaeger for tracing
  otlp/jaeger:
    endpoint: http://jaeger:4317
    tls:
      insecure: true

  # Debug exporter for debugging (replaces deprecated logging exporter)
  debug:
    verbosity: detailed

  # Prometheus metrics endpoint for collector monitoring
  prometheus:
    endpoint: "0.0.0.0:9090"

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance profiling
  pprof:
    endpoint: 0.0.0.0:8889
  
service:
  extensions: [health_check, pprof]
  
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/metricsapp-traces, otlp/jaeger, debug]
    
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
    #otlphttp/metricsapp-metrics
    
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/metricsapp-logs, debug]

  telemetry:
    logs:
      level: "info"
    metrics:
      level: "basic" 